$kind: http-request
url: "{{base_url}}/photos"
method: POST
headers:
  Authorization: Bearer {{bearer_token}}
body:
  type: json
  content: |-
    {
        "photos": [
            {
                "key": "{{photo_bucket_key}}", 
                "fileName": "image.jpg",
                "contentType": "image/jpeg"
            }
        ]
    }
order: 2000
