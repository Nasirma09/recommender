$kind: http-request
url: "{{base_url}}/photos/uploads/sign_part"
method: GET
headers:
  Authorization: Bearer {{bearer_token}}
body:
  type: json
  content: |-
    {
        "uploadId": "{{photo_upload_id}}",
        "key": "{{photo_bucket_key}}",
        "part_number": 1
    }
scripts:
  - type: afterResponse
    code: |-
      const data = pm.response.json();
      pm.environment.set("photo_upload_url", data.url);
    language: text/javascript
settings: {}
order: 2000
