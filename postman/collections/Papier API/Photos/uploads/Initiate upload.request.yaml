$kind: http-request
url: "{{base_url}}/photos/uploads"
method: POST
headers:
  Authorization: Bearer {{bearer_token}}
body:
  type: json
  content: |-
    {
    	"filename": "image.jpg"
    }
scripts:
  - type: afterResponse
    code: |-
      const data = pm.response.json();
      pm.environment.set("photo_upload_id", data.uploadId);
      pm.environment.set("photo_bucket_key", data.key);
      pm.environment.set("photo_bucket_name", data.bucket);
    language: text/javascript
order: 1000
