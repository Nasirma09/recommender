$kind: http-request
url: "{{base_url}}/photos/uploads/complete"
method: POST
headers:
  Authorization: Bearer {{bearer_token}}
body:
  type: json
  content: |-
    {
        "uploadId": "{{photo_upload_id}}",
        "key": "{{photo_bucket_key}}",
        "parts": [
            {
                "part_number": 1,
                "etag": {{photo_etag}}
            }
        ]
    }
order: 4000
