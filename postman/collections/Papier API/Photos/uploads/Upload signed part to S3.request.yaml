$kind: http-request
url: "{{photo_upload_url}}"
method: PUT
headers:
  Content-Type: application/octet-stream
body:
  type: file
  content: {}
scripts:
  - type: afterResponse
    code: |-
      const etag = pm.response.headers.get("ETag");
      pm.environment.set("photo_etag", etag);
    language: text/javascript
order: 3000
